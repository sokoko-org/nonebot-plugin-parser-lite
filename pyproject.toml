[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-parser-lite-standalone"
version = "1.3.5"
description = "Standalone social-media link parser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "rich>=15.0.0,<16.0.0",
  "aiofiles>=23.2.1",
  "msgspec>=0.20.0,<1.0.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
  "curl_cffi>=0.15.0,<1.0.0",
  "httpx[http2]>=0.20.0,<1.0.0",
  "protobuf>=7.34.2,<8.0.0",
  "anyio>=4.0.0,<5.0.0",
  "ujson>=5.0.0,<6.0.0",
  "cryptography>45.0.0",
  "qrcode>=8.0,<9.0",
  "puremagic>=1.30",
  "pydantic>=2.10.0,<3.0.0",
  "typing-extensions>=4.12.0",
  "yarl>=1.9.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nonebot_plugin_parser_lite = ["parsers/tieba/*.desc"]
