name: Publish standalone branch

on:
  push:
    branches: [main]
    # 默认全部触发，再排除与独立版无关的路径（后面的规则覆盖前面的）
    # 产物与 standalone 分支一致时不会推送，误触发也无副作用
    paths:
      - '**'
      - '!docs/**'
      - '!assets/**'
      - '!tests/**'
      - '!api_txt/**'
      - '!README.md' # 独立版使用 scripts/standalone_templates/README.md
      - '!THEME.md'
      - '!.github/**'
      - '.github/workflows/standalone.yml'
  workflow_dispatch:

concurrency:
  group: publish-standalone
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Generate standalone tree
        run: python scripts/generate_standalone.py

      - name: Normalize generated imports
        uses: astral-sh/ruff-action@v3
        with:
          args: >-
            check --config ruff.toml --fix
          src: src/nonebot_plugin_parser_lite

      - name: Verify generated source
        run: python scripts/verify_standalone.py

      - name: Install standalone dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify standalone input and output
        run: python scripts/verify_standalone.py --imports

      - name: Publish generated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin

          source_main="$(git rev-parse HEAD)"
          if [[ "$source_main" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced during generation; the newer workflow run will publish it"
            exit 0
          fi

          # 独立版分支只包含这些路径（git add 只收录列出的路径，无需再做额外校验）
          publish_paths=(
            README.md LICENSE THIRD-PARTY-NOTICES.md
            requirements.txt pyproject.toml setup.py MANIFEST.in
            src/nonebot_plugin_parser_lite
          )

          export GIT_INDEX_FILE="$(mktemp -u)"
          git read-tree --empty
          git add -- "${publish_paths[@]}"
          tree="$(git write-tree)"

          parents=()
          if git rev-parse --verify -q refs/remotes/origin/standalone >/dev/null; then
            parent="$(git rev-parse refs/remotes/origin/standalone)"
            if [[ "$tree" == "$(git rev-parse "$parent^{tree}")" ]]; then
              echo "standalone tree unchanged, nothing to publish"
              exit 0
            fi
            parents=(-p "$parent")
          fi

          commit="$(git commit-tree "$tree" "${parents[@]}" -m "auto: publish standalone for $source_main")"
          echo "publishing standalone for ${source_main:0:12}"
          git push origin "$commit:refs/heads/standalone"
