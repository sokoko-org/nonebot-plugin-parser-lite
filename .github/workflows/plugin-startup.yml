name: Plugin startup test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/nonebot_plugin_parser_lite/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "scripts/verify_plugin_startup.py"
      - "scripts/verify_package.py"
      - ".github/workflows/plugin-startup.yml"

concurrency:
  group: plugin-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup:
    name: Load plugin and run startup callbacks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build and install package
        run: |
          python -m pip install build
          python -m build
          python scripts/verify_package.py
          python -m pip install dist/*.whl
          python -m pip install "nonebot2[fastapi]>=2.4.3,<3.0.0"
          python -m pip check

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(python -m playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        id: chromium-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Save Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Run plugin startup test
        run: python scripts/verify_plugin_startup.py

