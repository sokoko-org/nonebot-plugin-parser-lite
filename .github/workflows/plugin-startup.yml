name: Plugin startup test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/nonebot_plugin_parser_lite/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "scripts/verify_plugin_startup.py"
      - "scripts/verify_package.py"
      - ".github/workflows/plugin-startup.yml"

concurrency:
  group: plugin-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup:
    name: Load plugin and run startup callbacks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and install package
        run: |
          python -m pip install build
          python -m build
          python scripts/verify_package.py
          python -m pip install dist/*.whl
          python -m pip install "nonebot2[fastapi]>=2.4.3,<3.0.0"
          python -m pip check

      - name: Run plugin startup test
        run: python scripts/verify_plugin_startup.py

