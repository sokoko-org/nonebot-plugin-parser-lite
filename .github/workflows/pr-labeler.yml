name: PR Auto Label

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # The privileged follow-up reads PR metadata through the API, without artifacts.
      - name: Trigger label evaluation
        run: echo "PR metadata is ready for label evaluation"
