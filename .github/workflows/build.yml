name: Build artifacts

on:
  push:
    branches: [main]
    paths:
      - 'src/nonebot_plugin_parser_lite/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'README.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'scripts/generate_standalone.py'
      - 'scripts/verify_package.py'
      - 'scripts/verify_standalone.py'
      - 'scripts/standalone_templates/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distribution: [plugin, standalone]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate standalone tree
        if: matrix.distribution == 'standalone'
        run: python scripts/generate_standalone.py

      - name: Normalize standalone imports
        if: matrix.distribution == 'standalone'
        uses: astral-sh/ruff-action@v3
        with:
          args: check --config ruff.toml --fix
          src: src/nonebot_plugin_parser_lite

      - name: Verify standalone source
        if: matrix.distribution == 'standalone'
        run: python scripts/verify_standalone.py

      - name: Install build tools
        run: python -m pip install build packaging

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: python scripts/verify_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distribution }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
